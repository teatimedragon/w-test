server {
    listen 80;
    root /usr/share/nginx/html;

    # The API is served from the same origin, so the browser needs no CORS.
    location /store-manager/ { proxy_pass __API_UPSTREAM__; }
    location /event-manager/ { proxy_pass __API_UPSTREAM__; }

    location = /config.js { add_header Cache-Control "no-store"; }

    # Client-side routes (/registration/{eventId}, /admin) fall back to the app.
    location / { try_files $uri /index.html; }
}
